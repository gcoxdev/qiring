[package]
name = "qiring-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "qiring_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
anyhow.workspace = true
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
base64.workspace = true
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
url.workspace = true
uuid.workspace = true
zeroize.workspace = true
qiring-core = { path = "../../../crates/qiring-core" }
qiring-storage = { path = "../../../crates/qiring-storage" }
dom_query = { version = "0.27.0", default-features = false }
quick-xml = "0.42.0"
resvg = { version = "0.48.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"
gtk = "0.18.2"
webkit2gtk = "2.0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
