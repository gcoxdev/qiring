[workspace]
members = [
  "crates/qiring-crypto",
  "crates/qiring-storage",
  "crates/qiring-core",
  "apps/desktop/src-tauri",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0"
authors = ["QiRing Contributors"]

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6"
atomic-write-file = "0.3"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
data-encoding = "2"
hmac = "0.13"
rand = "0.8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
