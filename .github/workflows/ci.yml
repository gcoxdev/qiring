name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build bundled frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Validate application versions
        working-directory: apps/desktop
        run: node scripts/check-release-version.mjs

      - name: Test release tooling
        working-directory: apps/desktop
        run: npm run test:release

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Verify native desktop build
        working-directory: apps/desktop
        run: npm exec -- tauri build --debug --no-bundle --ci -- --locked

      - name: Audit JavaScript dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=moderate

      - name: Verify UI security contracts
        working-directory: apps/desktop
        run: npm run test:ui-contract

      - name: Install Chromium for UI tests
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: Run UI and accessibility tests
        working-directory: apps/desktop
        run: npm run test:e2e

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo audit
